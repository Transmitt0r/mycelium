packages:
  - "core/*"
  - "tools/*"
  - "apps/*"

# Most of these come from the `openclaw` peerDependency's own dependency
# tree (@google/genai, protobufjs, tree-sitter-bash), not from any package
# here's own dependencies -- they get installed locally because pnpm's
# autoInstallPeers resolves openclaw for local dev/typechecking. esbuild is
# there via vite/vitest; sqlite-vec ships a platform-specific native binary
# for @transmitt0r/mycelium-index's vector store; onnxruntime-node/sharp are
# @huggingface/transformers' native deps for @transmitt0r/mycelium-embed's local provider.
allowBuilds:
  '@google/genai': true
  esbuild: true
  onnxruntime-node: true
  openclaw: true
  protobufjs: true
  sharp: true
  sqlite-vec: true
  tree-sitter-bash: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.32'
  - '@ai-sdk/openai-compatible@3.0.17'
  - '@ai-sdk/provider-utils@5.0.15'
  - ai@7.0.42
