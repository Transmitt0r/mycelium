name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action opens/updates the "Version Packages" PR
      pull-requests: write
      id-token: write # to enable OIDC for npm trusted publishing/provenance

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets needs full history to diff against the last release

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run typecheck

      - run: bun run lint

      - run: bun test

      # Trusted publishing requires npm CLI >=11.5.1; pin explicitly rather
      # than relying on whatever version ships with the runner.
      - run: npm install -g npm@latest

      # One-time setup before this works: configure npm trusted publishing
      # (npmjs.com -> package -> Settings -> Trusted Publisher) for each
      # @mycelium/* package, pointing at this repo + workflow.
      - uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
