name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action opens/updates the "Version Packages" PR
      pull-requests: write
      id-token: write # to enable OIDC for npm trusted publishing/provenance

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets needs full history to diff against the last release

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test

      # Trusted publishing requires npm CLI >=11.5.1; pin explicitly rather
      # than relying on whatever version ships with the runner.
      - run: npm install -g npm@latest

      # One-time setup before this works: configure npm trusted publishing
      # (npmjs.com -> package -> Settings -> Trusted Publisher) for each
      # @transmitt0r/mycelium-* package, pointing at this repo + workflow.
      - uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
