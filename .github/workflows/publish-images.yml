name: Publish Docker Images to GHCR

# Build the standalone MCP-server images for apps/trilium + apps/paperless-ngx
# and push them to ghcr.io so deployments (e.g. Komodo) can pull ready-made
# images instead of building from source. Fires on the per-app release tags
# that release-apps.yml's semantic-release-monorepo creates
# (e.g. @transmitt0r/openclaw-plugin-trilium-v1.1.0). ci.yml's docker-build
# job stays build-only (no registry creds on PRs); this is the publish path.

on:
  push:
    tags:
      - '@transmitt0r/openclaw-plugin-trilium-v*'
      - '@transmitt0r/openclaw-plugin-paperless-ngx-v*'

permissions:
  contents: read
  packages: write # to push images to GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Each app releases on its own tag; one must not block the other.
      fail-fast: false
      matrix:
        include:
          - app: trilium
            package: '@transmitt0r/openclaw-plugin-trilium'
            image: mycelium-trilium-mcp
          - app: paperless-ngx
            package: '@transmitt0r/openclaw-plugin-paperless-ngx'
            image: mycelium-paperless-ngx-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A pushed tag only names one app; skip this matrix row if it belongs
      # to the other one. github.ref_name arrives via env (never interpolated
      # into the shell body) to avoid script injection from tag names; the
      # matrix.* values are workflow-controlled and safe to inline.
      - name: Check tag belongs to this app
        id: appcheck
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PREFIX="${{ matrix.package }}-"
          if [[ "$REF_NAME" == "$PREFIX"* ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.appcheck.outputs.match == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: steps.appcheck.outputs.match == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive version + image tags. github.ref_name / github.repository are
      # passed in via env (not interpolated into the shell body) to avoid
      # script injection from attacker-controlled tag names. GHCR requires
      # lowercase image names, so lowercase the owner/repo path. "latest" is
      # only added for stable (non-prerelease) versions so a tag like
      # v2.0.0-rc.1 never overwrites the stable latest.
      - name: Compute image tags
        if: steps.appcheck.outputs.match == 'true'
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PREFIX="${{ matrix.package }}-"
          VERSION="${REF_NAME#$PREFIX}"
          IMAGE="ghcr.io/${REPOSITORY,,}/${{ matrix.image }}"
          TAGS="${IMAGE}:${VERSION},${IMAGE}:${VERSION#v}"
          if [[ "$VERSION" != *-* ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      # Context is the repo root, not the app directory: the image needs its
      # @transmitt0r/mycelium-* workspace siblings (see both Dockerfiles).
      - name: Build and push
        if: steps.appcheck.outputs.match == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
