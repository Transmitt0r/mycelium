name: Release Apps

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      # Each app releases independently -- one failing (or one with nothing
      # to release) must not stop the others.
      fail-fast: false
      matrix:
        app: [paperless-ngx, trilium, onepassword]
    permissions:
      contents: write # to publish a GitHub release and push the release tag
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # to enable OIDC for npm trusted publishing/provenance

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release-monorepo needs full history to
          # scope commits/tags to this app's own path

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No registry-url here: it writes an .npmrc that conflicts with
          # @semantic-release/npm's own OIDC trusted-publishing auth.

      - run: pnpm install --frozen-lockfile

      # Builds every workspace package, including this app's
      # @transmitt0r/mycelium-* workspace dependencies -- @semantic-release/npm
      # publishes whatever `files` in package.json points at (dist/), which
      # only exists after a real build.
      - run: pnpm run build

      # Trusted publishing requires npm CLI >=11.5.1; the version bundled
      # with a given Node release can lag behind that, so pin explicitly
      # rather than relying on whatever setup-node happens to install.
      # Stick to the 11.x line, not @latest: npm 12.0.0 (2026-07-08) changed
      # `npm pack --json`'s output from a top-level array to an object keyed
      # by package name, which broke ClawHub CLI v0.23.1's own npm-pack
      # invocation ("npm pack did not return a tarball filename" -- it reads
      # `npmOutput[0]?.filename`, confirmed by reading ClawHub's own source).
      # >=11.5.1 already satisfies the trusted-publishing requirement.
      - run: npm install -g npm@^11

      # semantic-release-monorepo (see apps/${{ matrix.app }}/.releaserc.json's
      # "extends") filters commits/tags to this app's own directory, so
      # running from apps/${{ matrix.app }} against the shared repo history
      # (all three apps + core/tools share one git log since the
      # git-subtree merge) only considers this app's own commits.
      - name: Release
        working-directory: apps/${{ matrix.app }}
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consumed by scripts/publish-to-clawhub.sh, run as this app's
          # @semantic-release/exec publishCmd -- only invoked once
          # semantic-release has actually decided to publish a release.
          CLAWHUB_API_KEY: ${{ secrets.CLAWHUB_API_KEY }}

  # Build + push the standalone MCP-server Docker images to GHCR so
  # deployments (e.g. Komodo) can pull ready-made images. This lives in the
  # same workflow run as `release` rather than a separate `push: tags`
  # workflow because tags created with the repo's GITHUB_TOKEN do NOT
  # re-trigger workflows (GitHub recursion protection) -- so a tag-triggered
  # job would never fire. Only the two apps with Dockerfiles are built; the
  # onepassword app has none.
  publish-images:
    needs: release
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    strategy:
      # Each app's tag is resolved and gated independently in the meta step;
      # a job for one app must not block the other.
      fail-fast: false
      matrix:
        include:
          - app: trilium
            package: '@transmitt0r/openclaw-plugin-trilium'
            image: mycelium-trilium-mcp
          - app: paperless-ngx
            package: '@transmitt0r/openclaw-plugin-paperless-ngx'
            image: mycelium-paperless-ngx-mcp
    permissions:
      contents: read
      packages: write # to push images to GHCR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the release tags to derive the version

      # Resolve this app's latest release tag and derive version + image tags.
      # The matrix.* values below are workflow-controlled (safe to inline);
      # the trigger ref and repo owner come in via env, not shell
      # interpolation, to avoid script injection from tag names. GHCR
      # requires lowercase image names, so lowercase the owner path. We only
      # publish when the resolved tag points at the triggering commit -- i.e.
      # this run actually released the app -- so a push without a new release
      # (or one that only released the other app) never mutates an existing
      # version tag. "latest" is only added for stable (non-prerelease)
      # versions so a v2.0.0-rc.1 tag never overwrites it.
      - name: Compute image tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          PREFIX="${{ matrix.package }}-"
          # Ascending version sort, take the last: stable v2.0.0 sorts above
          # a v2.0.0-rc.1 prerelease, so the highest stable wins.
          TAG=$(git tag -l "${PREFIX}v*" --sort=v:refname | tail -1)
          if [[ -z "$TAG" ]] || [[ "$(git rev-parse "$TAG")" != "$TRIGGER_SHA" ]]; then
            echo "No release for ${{ matrix.app }} at this commit; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${TAG#$PREFIX}"
          IMAGE="ghcr.io/${OWNER,,}/${{ matrix.image }}"
          TAGS="${IMAGE}:${VERSION},${IMAGE}:${VERSION#v}"
          if [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.publish == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the repo root, not the app directory: the image needs its
      # @transmitt0r/mycelium-* workspace siblings (see both Dockerfiles).
      - name: Build and push
        if: steps.meta.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
