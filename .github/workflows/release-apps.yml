name: Release Apps

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      # Each app releases independently -- one failing (or one with nothing
      # to release) must not stop the others.
      fail-fast: false
      matrix:
        # image is the GHCR image basename (lowercase applied at build time);
        # onepassword ships no Dockerfile, so it writes no version file.
        include:
          - app: paperless-ngx
            package: '@transmitt0r/openclaw-plugin-paperless-ngx'
            image: mycelium-paperless-ngx-mcp
          - app: trilium
            package: '@transmitt0r/openclaw-plugin-trilium'
            image: mycelium-trilium-mcp
          - app: onepassword
            package: '@transmitt0r/openclaw-plugin-onepassword'
            image: ''
    permissions:
      contents: write # to publish a GitHub release and push the release tag
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # to enable OIDC for npm trusted publishing/provenance
      # NOTE: intentionally NOT packages:write here -- this job runs
      # third-party release/toolchain code (semantic-release + dependency
      # lifecycle scripts) and must not be able to push images to GHCR.

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release-monorepo needs full history to
          # scope commits/tags to this app's own path

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No registry-url here: it writes an .npmrc that conflicts with
          # @semantic-release/npm's own OIDC trusted-publishing auth.

      - run: pnpm install --frozen-lockfile

      # Builds every workspace package, including this app's
      # @transmitt0r/mycelium-* workspace dependencies -- @semantic-release/npm
      # publishes whatever `files` in package.json points at (dist/), which
      # only exists after a real build.
      - run: pnpm run build

      # Trusted publishing requires npm CLI >=11.5.1; the version bundled
      # with a given Node release can lag behind that, so pin explicitly
      # rather than relying on whatever setup-node happens to install.
      # Stick to the 11.x line, not @latest (see AGENTS.md: npm 12 changed
      # `npm pack --json` output and broke ClawHub CLI v0.23.1).
      - run: npm install -g npm@^11

      # semantic-release-monorepo (see apps/${{ matrix.app }}/.releaserc.json's
      # "extends") filters commits/tags to this app's own directory, so
      # running from apps/${{ matrix.app }} against the shared repo history
      # (all three apps + core/tools share one git log since the
      # git-subtree merge) only considers this app's own commits.
      #
      # If any release stage (npm, ClawHub, tag) fails, this step fails and
      # the version-info step below is skipped, so no image is published for
      # this app.
      - name: Release
        working-directory: apps/${{ matrix.app }}
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consumed by scripts/publish-to-clawhub.sh, run as this app's
          # @semantic-release/exec publishCmd -- only invoked once
          # semantic-release has actually decided to publish a release.
          CLAWHUB_API_KEY: ${{ secrets.CLAWHUB_API_KEY }}

      # Announce the released version for the publish-images job by writing a
      # per-app info file to an artifact. Only runs on success() (the default
      # after a fully successful `pnpm run release` for THIS app), so a leg
      # that didn't release produced no file -> no image for it. Each matrix
      # leg writes a distinct filename, so the artifact contains every app's
      # info without any merge/order ambiguity.
      - name: Record released version
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-info
          IMAGE="${{ matrix.image }}"
          if [[ -z "$IMAGE" ]]; then
            echo "{}" >> "release-info/${{ matrix.app }}.json"
            exit 0
          fi
          PREFIX="${{ matrix.package }}-"
          # Tag AT the released commit (--points-at dereferences annotated
          # tags; version-sort so the newest of any same-commit tags wins).
          TAG=$(git tag --points-at "$TRIGGER_SHA" "${PREFIX}v*" --sort=v:refname | tail -1)
          VERSION="${TAG#$PREFIX}"
          # Write plain JSON. Version may be empty (no tag at this commit).
          printf '{"app":"%s","image":"%s","version":"%s"}\n' \
            "${{ matrix.app }}" "$IMAGE" "$VERSION" \
            > "release-info/${{ matrix.app }}.json"

      - name: Upload release info
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-info
          path: release-info/
          if-no-files-found: ignore

  # Build + push the standalone MCP-server Docker images to GHCR so
  # deployments (e.g. Komodo) can pull ready-made images. Runs as its own job
  # with the absolute minimum token scope (packages: write only; no
  # contents/issues/pull-requests) and only for apps the release job recorded
  # a version for. Lives in the same workflow run rather than a separate
  # `push: tags` workflow because tags created with the repo's GITHUB_TOKEN
  # do not re-trigger workflows (GitHub recursion protection).
  publish-images:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      # Each app's image is built/pushed independently.
      fail-fast: false
      matrix:
        app: [paperless-ngx, trilium]
    permissions:
      contents: read # to check out the build context
      packages: write # to push images to GHCR -- and nothing else

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release info
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-info
          path: release-info

      # Read this app's version file (written only if the release leg
      # succeeded), derive image + tags. The matrix.app and the recorded
      # version/image (both workflow/dataset-controlled) are read into shell
      # variables; the repo owner comes in via env. ghcr requires lowercase
      # image names, so lowercase the owner path. "latest" is only added for
      # stable (non-prerelease) versions so a v2.0.0-rc.1 tag never
      # overwrites it.
      - name: Compute image tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          INFO="release-info/${{ matrix.app }}.json"
          if [[ ! -f "$INFO" ]]; then
            echo "No release recorded for ${{ matrix.app }}; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(jq -r '.version // empty' "$INFO")
          IMG_NAME=$(jq -r '.image // empty' "$INFO")
          if [[ -z "$VERSION" || -z "$IMG_NAME" ]]; then
            echo "No version recorded for ${{ matrix.app }}; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IMAGE="ghcr.io/${OWNER,,}/${IMG_NAME}"
          TAGS="${IMAGE}:${VERSION},${IMAGE}:${VERSION#v}"
          if [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.publish == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the repo root, not the app directory: the image needs its
      # @transmitt0r/mycelium-* workspace siblings (see both Dockerfiles).
      - name: Build and push
        if: steps.meta.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
