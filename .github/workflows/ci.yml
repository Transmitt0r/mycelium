name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # @mycelium/index's sqlite-vec backing needs node:sqlite, which Bun
      # doesn't implement — its integration test runs under Node, everything
      # else in this repo runs under Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run typecheck

      - run: bun run lint

      - run: bun test

      - run: bun run test:integration
        working-directory: packages/index
