name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [paperless-ngx, trilium]
    steps:
      - uses: actions/checkout@v7

      # Build-only, no push -- catches Dockerfile/pnpm-deploy regressions
      # (see AGENTS.md's Docker note) without needing any registry
      # credentials. Context is the repo root, not the app directory: the
      # image needs its @transmitt0r/mycelium-* workspace siblings to build.
      - run: docker build -f apps/${{ matrix.app }}/Dockerfile -t ${{ matrix.app }}-mcp:ci .
